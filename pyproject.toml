[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaostoolkit-aws-mcp-server"
version = "0.2.0"
description = "MCP Server for Chaos Toolkit AWS experiments"
authors = [
    {name = "RadiumGu"},
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The low level decorator API used here was removed in mcp 2.x.
    "mcp>=1.0.0,<2.0.0",
    "chaostoolkit>=1.15.0",
    "chaostoolkit-aws>=0.21.0",
    # Highest published version is 0.1.10.
    "aws-az-failure-chaostoolkit>=0.1.10,<0.2.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.8.0",
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
chaostoolkit-aws-mcp-server = "chaostoolkit_aws_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chaostoolkit_aws_mcp_server"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
